[package]
name = "nfoglow"
version = "1.1.4"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["DigitGram"]
description = "NFO and ANSI art viewer for Windows"

[dependencies]
base64 = "0.23.1"
eframe = { version = "0.35", default-features = false, features = ["wgpu", "x11", "wayland", "accesskit"] }
flate2 = "1.1.11"
png = "0.18.1"
rfd = "0.18.0"
rodio = { version = "0.23.0", default-features = false, features = ["playback", "flac", "mp3", "vorbis", "wav", "mp4"] }
serde_json = "1.0.154"
sys-locale = "0.3.2"
unicode-width = "0.2"
# tracker music (MOD, XM, S3M, IT), pure Rust: only the importers and the player, no CLI
xmrs = { version = "0.15.0", default-features = false, features = ["std", "import_mod", "import_xm", "import_s3m", "import_it"] }
xmrsplayer = { version = "0.15.0", default-features = false, features = ["std", "import_mod", "import_xm", "import_s3m", "import_it"] }
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(windows)'.dependencies]
# the background of the window until the graphics card's first frame is on the screen (main.rs, window_background);
# both are already in the build through eframe and winit
raw-window-handle = "0.6.2"
windows-sys = { version = "0.61.2", features = ["Win32_Graphics_Gdi", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = "z"   # a small setup.exe matters more than the last bit of speed
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
winresource = "0.1.34"

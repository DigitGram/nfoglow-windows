#
# Tests and builds NfoGlow on Windows: NfoGlow-Setup-<version>.exe and the portable NfoGlow-Portable-<version>.exe (the
# program itself, no installation), as a download of the run.
# A tag v<version> must match the version in Cargo.toml. A release published on GitHub (by hand, on such a tag) gets the
# setup, the portable exe and SHA256SUMS.txt attached by this workflow, built from the tag.
name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # only the release step uses it: to attach the files
    steps:
      - uses: actions/checkout@v4

      - name: The tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "The tag is $GITHUB_REF_NAME, Cargo.toml says $version"; exit 1; }

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Setup
        shell: bash
        run: |
          makensis="/c/Program Files (x86)/NSIS/makensis.exe"
          [ -x "$makensis" ] || choco install nsis --yes --no-progress
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          "$makensis" -DVERSION="$version" installer/nfoglow.nsi

      - name: Portable
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          cp target/release/nfoglow.exe "target/NfoGlow-Portable-$version.exe"

      - name: Attach to the release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          cp target/NfoGlow-Setup-*.exe target/NfoGlow-Portable-*.exe .
          sha256sum NfoGlow-Setup-*.exe NfoGlow-Portable-*.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" NfoGlow-Setup-*.exe NfoGlow-Portable-*.exe SHA256SUMS.txt --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: NfoGlow-Windows
          path: |
            target/NfoGlow-Setup-*.exe
            target/NfoGlow-Portable-*.exe
          if-no-files-found: error

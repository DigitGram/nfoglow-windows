name: Feature request
description: Suggest an improvement or a new feature
labels:
- enhancement
body:
- type: markdown
  attributes:
    value: Ideas are welcome. NfoGlow is a small, focused viewer, so please describe the problem you want solved, not only
      the solution.
- type: textarea
  id: problem
  attributes:
    label: What do you want to do?
    description: Describe the situation where you are missing something.
  validations:
    required: true
- type: textarea
  id: idea
  attributes:
    label: What would you like to see?
    description: An idea, a mock-up or a reference to a similar viewer is welcome.
- type: textarea
  id: alt
  attributes:
    label: What do you do today instead?
    description: Workarounds and alternatives you tried.
- type: dropdown
  id: kind
  attributes:
    label: Is this about
    options:
    - Showing NFO or ANSI files
    - Effects and looks
    - Music
    - Export and copying
    - Settings
    - Something else
- type: input
  id: version
  attributes:
    label: NfoGlow version (optional)
    placeholder: '1.1.4'
- type: textarea
  id: shots
  attributes:
    label: Screenshots or mock-ups (optional)
    description: Drag and drop images here.
- type: checkboxes
  id: dupes
  attributes:
    label: Before sending
    options:
    - label: I searched the existing issues and found none for this idea
      required: true
